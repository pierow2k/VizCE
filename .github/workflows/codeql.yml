
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build VizCE
        run: make debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
